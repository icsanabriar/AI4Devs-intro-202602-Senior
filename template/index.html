<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse String</title>
    <style>
        :root {
            --max-width: 42rem;
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
            --radius: 0.5rem;
            --radius-lg: 0.75rem;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
            --color-bg: #f8f9fa;
            --color-text: #1a1a1a;
            --color-text-muted: #5c5c5c;
            --color-card-bg: #fff;
            --color-border: #e5e7eb;
            --color-cta: #1a1a1a;
            --color-cta-hover: #333;
            --input-height: 2.75rem;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--color-text);
            background: var(--color-bg);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--space-lg);
        }

        main {
            padding: var(--space-2xl) 0;
        }

        .hero {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }

        .hero__title {
            margin: 0 0 var(--space-sm);
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--color-text);
        }

        .hero__text {
            margin: 0;
            font-size: 1rem;
            color: var(--color-text-muted);
            max-width: 32ch;
            margin-left: auto;
            margin-right: auto;
        }

        .card {
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: var(--space-xl);
        }

        #reverse-form {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            align-items: flex-end;
        }

        .field {
            flex: 1 1 100%;
            min-width: 0;
        }

        @media (min-width: 30rem) {
            .field {
                flex: 1 1 auto;
            }
        }

        label[for="string-input"] {
            display: block;
            margin-bottom: var(--space-xs);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text);
        }

        #string-input {
            display: block;
            width: 100%;
            height: var(--input-height);
            padding: 0 var(--space-md);
            font: inherit;
            font-size: 1rem;
            color: var(--color-text);
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        #string-input:hover {
            border-color: #c4c8cc;
        }

        #string-input:focus {
            outline: none;
            border-color: var(--color-cta);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
        }

        #reverse-btn {
            height: var(--input-height);
            padding: 0 var(--space-lg);
            font: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fff;
            background: var(--color-cta);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        #reverse-btn:hover:not(:disabled) {
            background: var(--color-cta-hover);
        }

        #reverse-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.2);
        }

        .result-wrap {
            margin-top: var(--space-lg);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--color-border);
        }

        #result-label {
            margin: 0 0 var(--space-xs);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        #result {
            display: block;
            min-height: 1.5em;
            font-size: 1rem;
            color: var(--color-text);
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <main>
            <header class="hero">
                <h1 class="hero__title">Reverse String</h1>
                <p class="hero__text">Type or paste text below and see it reversed in real time.</p>
            </header>
            <div class="card">
                <form id="reverse-form" aria-label="Reverse string">
                    <div class="field">
                        <label for="string-input">Enter text</label>
                        <input type="text" id="string-input" name="string-input" autocomplete="off" />
                    </div>
                    <div class="field">
                        <button type="submit" id="reverse-btn">Reverse</button>
                    </div>
                </form>
                <div class="result-wrap">
                    <p id="result-label">Reversed</p>
                    <output id="result" aria-live="polite" aria-atomic="true"></output>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
